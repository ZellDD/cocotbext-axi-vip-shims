[pytest]
# Coverage of axis_vip_dpi.py on every run (source etc. in .coveragerc). The
# C side (axis_dpi.cpp) is reported by conftest.py.
addopts = --cov --cov-report=term-missing
          --cov-report=html:test/axi_vip_shims/axi_stream_vip_shims/artifacts/coverage/python
          --cov-report=xml:test/axi_vip_shims/axi_stream_vip_shims/artifacts/coverage/python/coverage.xml
